model_name: "AMDM"

diffusion:
    sample_mode: "ddpm"
    estimate_mode: "x0"
    loss_type: "l1"
    noise_schedule_mode: "cosine"
    T: 40 #25

model_hyperparam:
    layer_num: 25
    #cond_mask_prob: 0
    norm_type: "group_norm"
    act_type: "SiLU"
    #cond_emb_size: 256 #condition frame for [class, text, etc]
    time_emb_size: 256 #time embediing
    hidden_size: 1024 
    use_cond: False
    cond_num_cls: 0

optimizer:
    consistency_on: False
    consist_loss_weight: 0
    anneal_times: 2
    initial_lr: 0.001
    final_lr: 0.000001
    initial_teacher_epochs: 200 
    teacher_epochs: 0
    ramping_epochs: 0
    student_epochs: 280
    peak_student_rate: 1.0
    mini_batch_size: 4096
    rollout: 3
    EMA: 
        ema_decay: 0.99
        ema_start: 5000
        ema_update_rate: 1

data:   
    dataset_name: "AMASS"
    path: "../AMDM_origin/AMDM/data/AMASS"
    root_rot_offset: -90 #degree
    data_fps: 30
    min_motion_len: 0
    max_motion_len: -1
    data_trim_begin: 0
    data_trim_end: -1
    data_rot_rpr: 6d
    data_component: [position, velocity, angle, offset]


test:
    test_interval: 50
    test_num_steps: 60
    test_num_trials: 5
    test_num_init_frame: 3

text:
    text_cond: False
    babel_path: "data/train.json"

block:
    size: 3
    conds_flag: false
    overlap: 0
